<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0D081F">
<title>GodX Admin — Control Panel</title>
<!-- network warm-up -->
<link rel="dns-prefetch" href="https://www.gstatic.com">
<link rel="dns-prefetch" href="https://fonts.googleapis.com">
<link rel="dns-prefetch" href="https://fonts.gstatic.com">
<link rel="dns-prefetch" href="https://firestore.googleapis.com">
<link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com">
<link rel="dns-prefetch" href="https://securetoken.googleapis.com">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- css preloaded, fonts non-blocking -->
<link rel="preload" as="style" href="admin.css">
<link rel="stylesheet" href="admin.css">
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&family=Inter:wght@500;600;700;800&family=Manrope:wght@500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&family=Inter:wght@500;600;700;800&family=Manrope:wght@500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&family=Inter:wght@500;600;700;800&family=Manrope:wght@500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
</head>
<body>

<!-- LOGIN (visible by default — JS hides it only for a verified admin session,
     so a slow/blocked Firebase CDN can never leave a blank page) -->
<div id="login-view">
  <div class="login-card">
    <div class="login-logo">
      <svg viewBox="0 0 48 48" width="46" height="46"><defs><linearGradient id="ga-navy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B1040"/><stop offset="1" stop-color="#7C3AED"/></linearGradient></defs><rect width="48" height="48" rx="12" fill="url(#ga-navy)"/><path d="M24 12c-5 0-9 3.4-9 8 0 3 1.8 5.3 4.5 6.6L18 36l6-3 6 3-1.5-9.4C31.2 25.3 33 23 33 20c0-4.6-4-8-9-8z" fill="#fff"/><circle cx="24" cy="20" r="3.4" fill="#67E8F9"/></svg>
    </div>
    <h1>GodX Admin</h1>
    <p class="muted">Control panel — sign in with an admin account</p>
    <p class="muted" id="login-status" style="margin-top:8px">Checking session…</p>
    <form id="admin-login">
      <label>Email<input type="email" id="ad-email" required placeholder="admin@godx.app"></label>
      <label>Password<input type="password" id="ad-pass" required placeholder="••••••••"></label>
      <button class="btn btn-primary btn-block" type="submit">Sign In</button>
    </form>
  </div>
</div>

<!-- PANEL -->
<div id="panel" class="hidden">
  <aside id="sidebar">
    <div class="sb-brand">
      <svg viewBox="0 0 48 48" width="34" height="34"><defs><linearGradient id="ga-navy2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B1040"/><stop offset="1" stop-color="#7C3AED"/></linearGradient></defs><rect width="48" height="48" rx="10" fill="url(#ga-navy2)"/><path d="M24 12c-5 0-9 3.4-9 8 0 3 1.8 5.3 4.5 6.6L18 36l6-3 6 3-1.5-9.4C31.2 25.3 33 23 33 20c0-4.6-4-8-9-8z" fill="#fff"/></svg>
      <span>GodX Admin</span>
    </div>
    <nav id="sb-nav">
      <button class="sb-item active" data-p="dashboard"><span class="sb-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg></span><span>Dashboard</span></button>
      <button class="sb-item" data-p="requests"><span class="sb-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg></span><span>Requests</span><span class="sb-badge" id="badge-req"></span></button>
      <button class="sb-item" data-p="payouts"><span class="sb-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg></span><span>Plan Payouts</span><span class="sb-badge" id="badge-due"></span></button>
      <button class="sb-item" data-p="interest"><span class="sb-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5"/><path d="M5 3 2 6"/><path d="m22 6-3-3"/></svg></span><span>Daily Interest</span></button>
      <button class="sb-item" data-p="history"><span class="sb-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M9 13h6"/><path d="M9 17h6"/></svg></span><span>Transactions</span></button>
      <button class="sb-item" data-p="payments"><span class="sb-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg></span><span>Payment Methods</span></button>
      <button class="sb-item" data-p="users"><span class="sb-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span><span>Users</span></button>
      <button class="sb-item" data-p="plans"><span class="sb-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg></span><span>Plans</span></button>
      <button class="sb-item" data-p="announce"><span class="sb-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-5v12L3 13v-2z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg></span><span>Announcements</span></button>
      <button class="sb-item" data-p="chats"><span class="sb-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg></span><span>Support Chats</span><span class="sb-badge" id="badge-chat"></span></button>
      <button class="sb-item" data-p="content"><span class="sb-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg></span><span>App Content</span></button>
      <button class="sb-item" data-p="referral"><span class="sb-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg></span><span>Refer & Earn</span></button>
      <button class="sb-item" data-p="share"><span class="sb-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.59 13.51 6.83 3.98"/><path d="m15.41 6.51-6.82 3.98"/></svg></span><span>Share Settings</span></button>
      <button class="sb-item" data-p="limits"><span class="sb-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg></span><span>Wallet Limits</span></button>
    </nav>
    <button class="sb-item sb-logout" id="ad-logout"><span class="sb-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span><span>Logout</span></button>
  </aside>

  <main id="panel-main">
    <header id="panel-top">
      <h2 id="page-title">Dashboard</h2>
      <div class="pt-right"><span class="chip chip-green" id="admin-chip">Admin</span></div>
    </header>

    <section id="page-dashboard" class="page"></section>
    <section id="page-requests" class="page hidden"></section>
    <section id="page-payouts" class="page hidden"></section>
    <section id="page-interest" class="page hidden"></section>
    <section id="page-history" class="page hidden"></section>
    <section id="page-payments" class="page hidden"></section>
    <section id="page-users" class="page hidden"></section>
    <section id="page-plans" class="page hidden"></section>
    <section id="page-announce" class="page hidden"></section>
    <section id="page-chats" class="page hidden"></section>
    <section id="page-content" class="page hidden"></section>
    <section id="page-referral" class="page hidden"></section>
    <section id="page-share" class="page hidden"></section>
    <section id="page-limits" class="page hidden"></section>
  </main>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script defer src="config.js"></script>
<script defer src="admin.js"></script>
</body>
</html>
